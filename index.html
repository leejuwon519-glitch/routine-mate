<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9c83b8">
  <meta name="description"
        content="친구와 같은 공간에서 건강한 루틴을 만드는 게임형 앱">
  <title>루틴메이트 · 루틴 월드</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" data-action="home">
        <span class="brand-icon">☾</span>
        <span>루틴메이트</span>
      </button>

      <div class="topbar-right">
        <span id="connection" class="connection">연결 중</span>

        <button class="coin-button" data-action="shop">
          🪙 <strong id="coins">0</strong>
          <span>코인</span>
        </button>

        <button
          id="profile-button"
          class="profile-button"
          data-action="profile"
          aria-label="프로필 설정"
        >🐰</button>
      </div>
    </header>

    <main id="world" class="world">
      <section class="location">
        <div class="eyebrow">나의 작은 루틴 월드</div>
        <h1 id="location-title">라벤더 카페</h1>
        <p id="greeting">나만의 속도로, 함께해요.</p>

        <button class="room-chip" data-action="rooms">
          <span>♧</span>
          <span id="room-name">친구들과 방 만나기</span>
          <span>›</span>
        </button>
      </section>

      <div class="world-selector" aria-label="공간 선택">
        <button data-world="cafe" class="selected">
          <span>☕</span>카페
        </button>
        <button data-world="library">
          <span>📚</span>도서관
        </button>
        <button data-world="garden">
          <span>🌿</span>정원
        </button>
        <button data-world="bedroom">
          <span>🌙</span>나의 방
        </button>
      </div>

      <div class="game-stage">
        <canvas
          id="game"
          tabindex="0"
          aria-label="루틴 월드. 바닥을 누르거나 방향키로 캐릭터를 이동하세요."
        ></canvas>
      </div>

      <aside class="mission-panel">
        <div class="panel-top">
          <span>나만의 집중 시간</span>
          <span class="small-tag">루틴 메이트</span>
        </div>

        <div class="pet-area">
          <span id="pet">🐰</span>
          <div id="pet-name">루미 · Lv. 1</div>
        </div>

        <h2 id="mission-title">어떤 하루를 만들어볼까요?</h2>
        <p id="mission-description">
          잠시 머물며 나를 위한 루틴을 시작해요.
        </p>

        <div id="timer" class="timer">00:00:00</div>

        <div class="mode-selector">
          <button data-mode="sleep">
            <span>☾</span>수면
          </button>
          <button data-mode="focus" class="selected">
            <span>🌿</span>디지털 디톡스
          </button>
          <button data-mode="move">
            <span>👟</span>신체 활동
          </button>
        </div>

        <button
          id="mission-button"
          class="primary full"
          data-action="mission"
        >
          ▶ 디지털 디톡스 시작하기
        </button>

        <div id="reward-hint" class="reward-hint">
          🪙 집중 1시간마다 10코인
        </div>

        <button class="text-button" data-action="shop">
          코인으로 내 방 꾸미기 →
        </button>
      </aside>

      <section class="quest">
        <span class="quest-icon">✦</span>
        <div>
          <strong>오늘의 작은 퀘스트</strong>
          <p id="quest-description">
            첫 루틴을 마치고 내 방을 꾸며보세요.
          </p>
        </div>
        <span id="quest-count">0 / 3</span>
      </section>

      <div class="world-controls">
        <button data-action="zoom-out" aria-label="축소">−</button>
        <button data-action="zoom-reset" aria-label="원래 크기">⌖</button>
        <button data-action="zoom-in" aria-label="확대">+</button>
      </div>

      <p class="movement-hint">
        바닥 터치 · 방향키 이동 · 같은 공간에서 함께하기
      </p>

      <div id="login-banner" class="login-banner hidden">
        <strong>친구와 함께하는 루틴 월드</strong>
        <p>온라인 플레이를 시작하려면 로그인해 주세요.</p>
        <a
          class="primary"
          href="/signin-with-chatgpt?return_to=%2F"
          target="_top"
        >ChatGPT로 로그인</a>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="주 메뉴">
      <button data-action="home" class="selected">
        <span>⌂</span>홈
      </button>
      <button data-action="rooms">
        <span>♧</span>미션방
      </button>
      <button data-action="shop">
        <span>▧</span>나의 방
      </button>
      <button data-action="records">
        <span>▥</span>기록
      </button>
      <button data-action="settings">
        <span>⚙</span>설정
      </button>
    </nav>
  </div>

  <dialog id="dialog">
    <div class="dialog-header">
      <div>
        <span id="dialog-subtitle" class="eyebrow"></span>
        <h2 id="dialog-title"></h2>
      </div>
      <button
        class="close-button"
        data-action="close"
        aria-label="닫기"
      >×</button>
    </div>
    <div id="dialog-content"></div>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
